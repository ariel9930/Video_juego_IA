<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Elysium - Boss, Animaciones & Sonido</title>
    <style>
        body {
            margin: 0;
            background-color: #050508;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        h1 {
            margin: 5px 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        p {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: #8892b0;
        }
        #gameContainer {
            position: relative;
        }
        #btnPantalla {
            position: fixed;
            top: 8px;
            left: 10px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        #btnPantalla:hover { background: #00f0ff; color: #000; }
        canvas {
            background-color: #020204;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>

    <div id="cabecera" style="text-align:center"><h1>ECHOES OF ELYSIUM</h1>
    <p>Ecolocación, Precisión & Animaciones Cibernéticas</p></div>
    
    <button id="btnPantalla" tabindex="-1" onmousedown="event.preventDefault()">⛶ PANTALLA COMPLETA [F]</button>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- PANTALLA: resolución lógica fija 800x500, escalada para ocupar la ventana ---
        const LW = 800;
        const LH = 500;
        let escalaRender = 1;

        function ajustarPantalla() {
            let cab = document.getElementById("cabecera");
            let completa = !!document.fullscreenElement;
            let altoCab = (!completa && cab && cab.offsetHeight) || 0;
            let ancho = window.innerWidth - (completa ? 0 : 16);
            let alto = window.innerHeight - altoCab - (completa ? 0 : 16);
            let esc = Math.max(0.5, Math.min(ancho / LW, alto / LH));
            canvas.style.width = Math.floor(LW * esc) + "px";
            canvas.style.height = Math.floor(LH * esc) + "px";
            escalaRender = Math.min(2, Math.max(1, esc * (window.devicePixelRatio || 1)));
            canvas.width = Math.round(LW * escalaRender);
            canvas.height = Math.round(LH * escalaRender);
        }

        function alternarPantallaCompleta() {
            try {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    let pr = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
                    if (pr && pr.catch) pr.catch(() => {});
                }
            } catch (err) {}
        }

        function alCambiarPantallaCompleta() {
            let completa = !!document.fullscreenElement;
            let cab = document.getElementById("cabecera");
            let btn = document.getElementById("btnPantalla");
            if (cab) cab.style.display = completa ? "none" : "";
            if (btn) btn.style.display = completa ? "none" : "";
            ajustarPantalla();
        }

        window.addEventListener("resize", ajustarPantalla);
        document.addEventListener("fullscreenchange", alCambiarPantallaCompleta);
        document.getElementById("btnPantalla").addEventListener("click", (ev) => {
            ev.stopPropagation();
            alternarPantallaCompleta();
        });
        ajustarPantalla();

        // --- SISTEMA DE AUDIO (Web Audio API) ---
        let audioCtx = null;
        let audioMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (audioMuted || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                if (type === 'jump') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'echo') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'parry') {
                    let osc1 = audioCtx.createOscillator();
                    let osc2 = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc1.type = 'sine';
                    osc2.type = 'square';
                    osc1.frequency.setValueAtTime(800, now);
                    osc1.frequency.exponentialRampToValueAtTime(1600, now + 0.2);
                    osc2.frequency.setValueAtTime(400, now);
                    osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 0.2);
                    osc2.stop(now + 0.2);
                } else if (type === 'hit') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'shoot') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'explosion') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.4);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'portal') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'button') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.linearRampToValueAtTime(700, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'djump') {
                    let osc = audioCtx.createOscillator();
                    let osc2 = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(380, now);
                    osc.frequency.exponentialRampToValueAtTime(980, now + 0.18);
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(760, now);
                    osc2.frequency.exponentialRampToValueAtTime(1500, now + 0.18);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc2.start(now);
                    osc.stop(now + 0.2);
                    osc2.stop(now + 0.2);
                } else if (type === 'ulti') {
                    let osc = audioCtx.createOscillator();
                    let osc2 = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.35);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 1.0);
                    osc2.type = 'square';
                    osc2.frequency.setValueAtTime(45, now);
                    osc2.frequency.exponentialRampToValueAtTime(25, now + 1.0);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
                    osc.connect(gain);
                    osc2.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc2.start(now);
                    osc.stop(now + 1.0);
                    osc2.stop(now + 1.0);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                        gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.4);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.4);
                    });
                }
            } catch(e) {}
        }

        // --- ESTADOS Y VARIABLES PRINCIPALES ---
        let estadoJuego = "MENU";

        let player = {
            x: 400,
            y: 350,
            radius: 12,
            speed: 5.5,
            vx: 0,
            vy: 0
        };

        let nivelActual = 1;
        let juegoTerminado = false;
        let gameOver = false;
        let esperandoSiguienteNivel = false;
        let ondasRestantes = 3;
        let vidas = 3;
        let contadorFrames = 0;
        let temblorPantalla = 0;

        let mouseX = 0;
        let mouseY = 0;

        let comboParry = 0;
        let textosCombo = [];
        let rastroJugador = [];

        // --- EFECTOS Y ANIMACIONES ---
        let animPerderVidaTimer = 0;
        let animRespawnTimer = 0;
        let animVictoriaTimer = 0;
        let particulasPerderVida = [];
        let fuegosArtificiales = [];

        let estrellasFondo = [];
        let particulasVacio = [];
        let particulasCristal = [];
        let particulasBoss = [];
        let particulasHumo = [];

        for (let i = 0; i < 70; i++) {
            estrellasFondo.push({
                x: Math.random() * LW,
                y: Math.random() * LH,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random(),
                velocidadParpadeo: Math.random() * 0.03 + 0.01
            });
        }

        for (let i = 0; i < 40; i++) {
            particulasVacio.push({
                x: Math.random() * LW,
                y: LH - Math.random() * 45,
                vx: (Math.random() - 0.5) * 1.2,
                vy: -Math.random() * 0.8 - 0.2,
                size: Math.random() * 3 + 1,
                alpha: Math.random() * 0.7 + 0.3
            });
        }

        let boss = {
            x: 400,
            y: 100,
            radius: 40,
            vidaMax: 10,
            vida: 10,
            fase: 1,
            derrotado: false,
            animDefeatedTimer: 0
        };

        let dronTutorial = {
            x: 400,
            y: 110,
            dir: 1
        };

        let proyectilesBoss = [];
        let proyectilesTutorial = [];
        let rayosCaoticos = [];
        let ondas = [];

        let keys = {};
        window.addEventListener("keydown", (e) => {
            initAudio();
            keys[e.code] = true;
            if (estadoJuego === "MULTI" && mp) multiTecla(e.code);
            if (!e.repeat) manejarSaltoDoble(e.code);
            if (e.code === "KeyF" && !e.repeat) alternarPantallaCompleta();
            if (e.code === "Escape") {
                if (estadoJuego === "VESTIMENTAS") estadoJuego = "MENU";
                else if (estadoJuego === "JUEGO" && (gameOver || juegoTerminado)) {
                    estadoJuego = "MENU";
                    gameOver = false;
                    juegoTerminado = false;
                    vidas = 3;
                }
            }
            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
                accionarAccion();
            }
        });
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        canvas.addEventListener("mousemove", (e) => {
            let rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * (LW / rect.width);
            mouseY = (e.clientY - rect.top) * (LH / rect.height);
        });

        function accionarAccion() {
            if (estadoJuego === "MULTI" || estadoJuego === "VESTIMENTAS") return;
            initAudio();
            if (estadoJuego === "MENU") return;

            if (gameOver || juegoTerminado || estadoJuego === "GAME_OVER") {
                let listo = juegoTerminado ? animVictoriaTimer > 90 : (contadorFrames - gameOverDesde > 30);
                if (listo || estadoJuego === "GAME_OVER") reiniciarJuegoCompleto();
                return;
            }

            if (esperandoSiguienteNivel) {
                avanzarNivel();
                return;
            }

            if (estadoJuego === "TUTORIAL") {
                proyectilesTutorial.forEach(pr => {
                    if (!pr.devuelto && pr.esRojo) {
                        let dist = Math.hypot(player.x - pr.x, player.y - pr.y);
                        if (dist < 85) {
                            pr.devuelto = true;
                            temblorPantalla = 6;
                            pr.vy = -12;
                            playSound('parry');
                        }
                    }
                });
            } else if (nivelActual === 7 && !boss.derrotado && boss.animDefeatedTimer === 0) {
                if (ultCarga >= 5 && !ult) { lanzarUlti(); return; }
                let hizoParry = false;
                proyectilesBoss.forEach(pr => {
                    if (!pr.devuelto && pr.esRojo) {
                        let dist = Math.hypot(player.x - pr.x, player.y - pr.y);
                        if (dist < 85) {
                            pr.devuelto = true;
                            temblorPantalla = 7;
                            hizoParry = true;

                            if (pr.esRojo) {
                                pr.vy = -14;
                                pr.esParry = true;
                            } else {
                                pr.vy = -9.5;
                            }
                        }
                    }
                });

                if (hizoParry) {
                    comboParry++;
                    ultCarga = Math.min(5, ultCarga + 1);
                    fxAnillo(player.x, player.y, colorSkin(), 60, 18, false);
                    playSound('parry');
                    textosCombo.push({
                        text: comboParry > 1 ? `PARRY X${comboParry}!` : "PARRY!",
                        x: player.x,
                        y: player.y - 20,
                        alpha: 1.0,
                        scale: 1.2
                    });
                }
            } else {
                if (ondasRestantes > 0) {
                    ondas.push({ x: player.x, y: player.y, radioActual: 5, radioMax: 280, alpha: 1.0 });
                    ondasRestantes--;
                    playSound('echo');
                }
            }
        }

        window.addEventListener("click", (e) => {
            initAudio();

            // Botón de silencio en la esquina superior derecha
            if (mouseX >= LW - 45 && mouseX <= LW - 15 && mouseY >= 10 && mouseY <= 40) {
                audioMuted = !audioMuted;
                return;
            }

            if (estadoJuego === "MENU") {
                if (mouseX >= 280 && mouseX <= 520 && mouseY >= 385 && mouseY <= 433) {
                    playSound('button');
                    estadoJuego = "VESTIMENTAS";
                    return;
                }
                if (mouseX >= 280 && mouseX <= 520 && mouseY >= 205 && mouseY <= 253) {
                    playSound('button');
                    estadoJuego = "JUEGO";
                    cargarNivel(1);
                    return;
                }
                if (mouseX >= 280 && mouseX <= 520 && mouseY >= 325 && mouseY <= 373) {
                    playSound('button');
                    iniciarMulti();
                    return;
                }
                if (mouseX >= 280 && mouseX <= 520 && mouseY >= 265 && mouseY <= 313) {
                    playSound('button');
                    estadoJuego = "TUTORIAL";
                    proyectilesTutorial = [];
                    player.x = 400;
                    player.y = 350;
                    return;
                }
            } else if (estadoJuego === "VESTIMENTAS") {
                clickVestimentas();
            } else if (estadoJuego === "MULTI") {
                multiClick();
            } else if (estadoJuego === "TUTORIAL") {
                if (mouseX >= 50 && mouseX <= 200 && mouseY >= 440 && mouseY <= 480) {
                    playSound('button');
                    estadoJuego = "MENU";
                    return;
                }
                if (mouseX >= 590 && mouseX <= 750 && mouseY >= 440 && mouseY <= 480) {
                    playSound('button');
                    estadoJuego = "JUEGO";
                    cargarNivel(1);
                    return;
                }
                accionarAccion();
            } else {
                accionarAccion();
            }
        });

        function reiniciarJuegoCompleto() {
            fuegosArtificiales = [];
            particulasBoss = [];
            animVictoriaTimer = 0;
            vidas = 3;
            gameOver = false;
            juegoTerminado = false;
            estadoJuego = "JUEGO";
            cargarNivel(1);
        }

        const niveles = {
            1: {
                color: "#00f0ff",
                plataformas: [
                    { x: 50, y: 430, w: 220, h: 20, alphaVisibilidad: 0 },
                    { x: 230, y: 350, w: 180, h: 20, alphaVisibilidad: 0 },
                    { x: 380, y: 270, w: 180, h: 20, alphaVisibilidad: 0 },
                    { x: 280, y: 190, w: 180, h: 20, alphaVisibilidad: 0 },
                    { x: 420, y: 120, w: 150, h: 20, alphaVisibilidad: 0 }
                ],
                laseres: [],
                cristal: { x: 485, y: 80, w: 24, h: 40, activo: false, alphaVisibilidad: 0 },
                spawn: { x: 100, y: 400 }
            },
            2: {
                color: "#00ff88",
                plataformas: [
                    { x: 650, y: 430, w: 120, h: 20, alphaVisibilidad: 0 },
                    { x: 450, y: 360, w: 140, h: 20, alphaVisibilidad: 0 },
                    { x: 250, y: 290, w: 140, h: 20, alphaVisibilidad: 0 },
                    { x: 100, y: 210, w: 130, h: 20, alphaVisibilidad: 0 },
                    { x: 350, y: 140, w: 180, h: 20, alphaVisibilidad: 0 }
                ],
                laseres: [{ x1: 200, y1: 320, x2: 500, y2: 320, intervalo: 240 }],
                cristal: { x: 430, y: 100, w: 24, h: 40, activo: false, alphaVisibilidad: 0 },
                spawn: { x: 700, y: 400 }
            },
            3: {
                color: "#b000ff",
                plataformas: [
                    { x: 50, y: 440, w: 140, h: 20, alphaVisibilidad: 0 },
                    { x: 240, y: 370, w: 110, h: 20, alphaVisibilidad: 0 },
                    { x: 400, y: 300, w: 100, h: 20, alphaVisibilidad: 0 },
                    { x: 600, y: 230, w: 120, h: 20, alphaVisibilidad: 0 },
                    { x: 380, y: 160, w: 110, h: 20, alphaVisibilidad: 0 },
                    { x: 150, y: 90,  w: 130, h: 20, alphaVisibilidad: 0 }
                ],
                laseres: [
                    { x1: 150, y1: 340, x2: 450, y2: 340, intervalo: 200 },
                    { x1: 300, y1: 190, x2: 650, y2: 190, intervalo: 200 }
                ],
                cristal: { x: 205, y: 50, w: 24, h: 40, activo: false, alphaVisibilidad: 0 },
                spawn: { x: 100, y: 410 }
            },
            4: {
                color: "#ffaa00",
                plataformas: [
                    { x: 350, y: 440, w: 100, h: 20, alphaVisibilidad: 0 },
                    { x: 150, y: 380, w: 110, h: 20, alphaVisibilidad: 0 },
                    { x: 300, y: 300, w: 90,  h: 20, alphaVisibilidad: 0 },
                    { x: 500, y: 230, w: 100, h: 20, alphaVisibilidad: 0 },
                    { x: 300, y: 160, w: 110, h: 20, alphaVisibilidad: 0 },
                    { x: 100, y: 100, w: 100, h: 20, alphaVisibilidad: 0 }
                ],
                laseres: [
                    { x1: 100, y1: 340, x2: 450, y2: 340, intervalo: 170 },
                    { x1: 200, y1: 200, x2: 550, y2: 200, intervalo: 170 }
                ],
                cristal: { x: 140, y: 60, w: 24, h: 40, activo: false, alphaVisibilidad: 0 },
                spawn: { x: 380, y: 410 }
            },
            5: {
                color: "#ff007f",
                plataformas: [
                    { x: 50, y: 430, w: 120, h: 20, alphaVisibilidad: 0 },
                    { x: 220, y: 360, w: 100, h: 20, alphaVisibilidad: 0 },
                    { x: 380, y: 290, w: 100, h: 20, alphaVisibilidad: 0 },
                    { x: 550, y: 220, w: 100, h: 20, alphaVisibilidad: 0 },
                    { x: 350, y: 150, w: 100, h: 20, alphaVisibilidad: 0 },
                    { x: 180, y: 80,  w: 100, h: 20, alphaVisibilidad: 0 }
                ],
                laseres: [
                    { x1: 180, y1: 320, x2: 500, y2: 320, intervalo: 140 },
                    { x1: 250, y1: 250, x2: 650, y2: 250, intervalo: 140 },
                    { x1: 150, y1: 120, x2: 500, y2: 120, intervalo: 140 }
                ],
                cristal: { x: 220, y: 40, w: 24, h: 40, activo: false, alphaVisibilidad: 0 },
                spawn: { x: 100, y: 400 }
            },
            6: {
                color: "#ffd700",
                plataformas: [
                    { x: 640, y: 430, w: 110, h: 20, alphaVisibilidad: 0 },
                    { x: 490, y: 360, w: 90,  h: 20, alphaVisibilidad: 0 },
                    { x: 340, y: 290, w: 90,  h: 20, alphaVisibilidad: 0 },
                    { x: 190, y: 220, w: 90,  h: 20, alphaVisibilidad: 0 },
                    { x: 340, y: 150, w: 90,  h: 20, alphaVisibilidad: 0 },
                    { x: 540, y: 90,  w: 100, h: 20, alphaVisibilidad: 0 }
                ],
                laseres: [
                    { x1: 200, y1: 390, x2: 600, y2: 390, intervalo: 110 },
                    { x1: 150, y1: 250, x2: 600, y2: 250, intervalo: 110 },
                    { x1: 200, y1: 110, x2: 650, y2: 110, intervalo: 110 }
                ],
                cristal: { x: 585, y: 50, w: 24, h: 40, activo: false, alphaVisibilidad: 0 },
                spawn: { x: 690, y: 400 }
            },
            7: {
                color: "#00f0ff",
                plataformas: [
                    { x: 150, y: 380, w: 500, h: 24, alphaVisibilidad: 1.0 }
                ],
                laseres: [],
                cristal: { x: 388, y: 320, w: 24, h: 40, activo: false, alphaVisibilidad: 0 },
                spawn: { x: 400, y: 350 }
            }
        };

        let nivel = niveles[nivelActual];

        function cargarNivel(num) {
            nivelActual = num;
            ultCarga = 0; ult = null; ultFlash = 0;
            if (niveles[nivelActual]) {
                nivel = niveles[nivelActual];
                ondasRestantes = (nivelActual === 7) ? 0 : 3; 
                contadorFrames = 0;
                particulasCristal = [];
                proyectilesBoss = [];
                particulasHumo = [];
                rayosCaoticos = [];
                comboParry = 0;
                temblorPantalla = 0;
                if (nivelActual === 7) {
                    boss.vidaMax = 10;
                    boss.vida = 10;
                    boss.fase = 1;
                    boss.derrotado = false;
                    boss.animDefeatedTimer = 0;
                }
                reiniciarPosicionJugador();
            } else {
                iniciarVictoria();
            }
        }

        function perderVida() {
            if (ult) return; // invulnerable durante la ulti
            comboParry = 0;
            vidas--;
            playSound('hit');
            animPerderVidaTimer = 30; // 30 frames de vignette roja

            // Partículas de explosión del jugador
            for (let i = 0; i < 40; i++) {
                particulasPerderVida.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    radius: Math.random() * 4 + 2,
                    alpha: 1.0,
                    color: Math.random() < 0.5 ? "#ff0055" : "#ffffff"
                });
            }

            if (vidas <= 0) {
                gameOver = true;
                gameOverDesde = contadorFrames;
            } else {
                reiniciarPosicionJugador();
                animRespawnTimer = 40; // Respawn holográfico
            }
        }

        function reiniciarPosicionJugador() {
            player.x = nivel.spawn.x;
            player.y = nivel.spawn.y;
            player.vx = 0;
            player.vy = 0;
            nivel.cristal.activo = false;
            nivel.cristal.alphaVisibilidad = (nivelActual === 7 && boss.derrotado) ? 1.0 : 0;
            esperandoSiguienteNivel = false;
            ondas = [];
            contadorFrames = 0;
            if (nivelActual !== 7) ondasRestantes = 3;
            nivel.plataformas.forEach(p => {
                p.alphaVisibilidad = (nivelActual === 7) ? 1.0 : 0;
            });
        }

        function mecerAnimaciones() {
            estrellasFondo.forEach(st => {
                st.alpha += Math.sin(contadorFrames * st.velocidadParpadeo) * 0.015;
            });

            particulasVacio.forEach(pt => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                if (pt.y < LH - 50) {
                    pt.y = LH - 5;
                    pt.x = Math.random() * LW;
                }
            });
        }

        function avanzarNivel() {
            playSound('portal');
            if (nivelActual < 7) {
                cargarNivel(nivelActual + 1);
            } else {
                iniciarVictoria();
            }
        }

        function iniciarVictoria() {
            juegoTerminado = true;
            esperandoSiguienteNivel = false;
            animVictoriaTimer = 0;
            playSound('win');

            // Fuegos artificiales iniciales
            for (let i = 0; i < 5; i++) {
                crearCoheteVictoria();
            }
        }

        function crearCoheteVictoria() {
            let startX = 100 + Math.random() * 600;
            fuegosArtificiales.push({
                x: startX,
                y: LH,
                vy: -Math.random() * 4 - 8,
                targetY: 100 + Math.random() * 150,
                explotado: false,
                color: ["#00f0ff", "#00ff88", "#ff007f", "#ffd700", "#b000ff"][Math.floor(Math.random() * 5)]
            });
        }

        function actualizar() {
            contadorFrames++;
            if (temblorPantalla > 0) temblorPantalla -= 0.5;

            mecerAnimaciones();
            actualizarFx();
            if (estadoJuego === "VESTIMENTAS") return;
            if (estadoJuego === "MULTI") { actualizarMulti(); return; }

            if (estadoJuego === "MENU") return;

            // ACTUALIZAR ANIMACIÓN DE DERROTA DE BOSS
            if (boss.animDefeatedTimer > 0) {
                boss.animDefeatedTimer--;
                temblorPantalla = 12;

                if (contadorFrames % 6 === 0) {
                    playSound('explosion');
                    for (let i = 0; i < 15; i++) {
                        particulasBoss.push({
                            x: boss.x + (Math.random() - 0.5) * 80,
                            y: boss.y + (Math.random() - 0.5) * 80,
                            vx: (Math.random() - 0.5) * 12,
                            vy: (Math.random() - 0.5) * 12,
                            alpha: 1.0,
                            color: Math.random() < 0.5 ? "#00f0ff" : "#ff0055"
                        });
                    }
                }

                if (boss.animDefeatedTimer === 0) {
                    boss.derrotado = true;
                    nivel.cristal.alphaVisibilidad = 1.0;
                    esperandoSiguienteNivel = true;
                }
                return;
            }

            // ACTUALIZAR VICTORIA Y FUEGOS ARTIFICIALES
            if (juegoTerminado) {
                animVictoriaTimer++;
                if (contadorFrames % 25 === 0) {
                    crearCoheteVictoria();
                }

                fuegosArtificiales.forEach(fw => {
                    if (!fw.explotado) {
                        fw.y += fw.vy;
                        if (fw.y <= fw.targetY) {
                            fw.explotado = true;
                            playSound('explosion');
                            for (let i = 0; i < 35; i++) {
                                let angulo = Math.random() * Math.PI * 2;
                                let vel = Math.random() * 6 + 2;
                                particulasBoss.push({
                                    x: fw.x,
                                    y: fw.y,
                                    vx: Math.cos(angulo) * vel,
                                    vy: Math.sin(angulo) * vel,
                                    alpha: 1.0,
                                    color: fw.color
                                });
                            }
                        }
                    }
                });
                fuegosArtificiales = fuegosArtificiales.filter(fw => !fw.explotado);

                particulasBoss.forEach(pt => {
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.vy += 0.05; // Gravedad suave
                    pt.alpha -= 0.02;
                });
                particulasBoss = particulasBoss.filter(pt => pt.alpha > 0);
                return;
            }

            // MODO TUTORIAL
            if (estadoJuego === "TUTORIAL") {
                if (keys["KeyA"] || keys["ArrowLeft"]) player.x -= player.speed;
                if (keys["KeyD"] || keys["ArrowRight"]) player.x += player.speed;

                if ((keys["KeyW"] || keys["ArrowUp"]) && player.vy === 0) {
                    player.vy = -10;
                    playSound('jump');
                }

                player.vy += 0.38;
                player.y += player.vy;

                if (player.x < 15) player.x = 15;
                if (player.x > LW - 15) player.x = LW - 15;

                let pTut = { x: 150, y: 380, w: 500, h: 24 };
                let enRangoXTut = player.x + player.radius > pTut.x && player.x - player.radius < pTut.x + pTut.w;

                if (
                    enRangoXTut &&
                    player.y + player.radius >= pTut.y &&
                    player.y + player.radius <= pTut.y + pTut.h / 2 &&
                    player.vy > 0
                ) {
                    player.y = pTut.y - player.radius;
                    player.vy = 0;
                }

                if (player.y > LH + 15) {
                    player.x = 400;
                    player.y = 350;
                    player.vy = 0;
                }

                visualTick(player, dirEntrada(), colorSkin());

                dronTutorial.x += 2.5 * dronTutorial.dir;
                if (dronTutorial.x > 580) dronTutorial.dir = -1;
                if (dronTutorial.x < 220) dronTutorial.dir = 1;

                if (contadorFrames % 100 === 0) {
                    let esRojo = Math.random() < 0.5;
                    proyectilesTutorial.push({
                        x: dronTutorial.x,
                        y: dronTutorial.y,
                        vy: 2.2,
                        vx: (Math.random() - 0.5) * 1.5,
                        radius: esRojo ? 10 : 8,
                        esRojo: esRojo,
                        devuelto: false
                    });
                    playSound('shoot');
                }

                proyectilesTutorial.forEach(pr => {
                    if (pr.devuelto) {
                        pr.vx = (dronTutorial.x - pr.x) * 0.14;
                    }
                    pr.x += pr.vx;
                    pr.y += pr.vy;
                    if (pr.devuelto) {
                        let dDron = Math.hypot(dronTutorial.x - pr.x, dronTutorial.y - pr.y);
                        if (dDron < 35) {
                            pr.destruir = true;
                            temblorPantalla = 8;
                            playSound('explosion');
                        }
                    }
                });
                proyectilesTutorial = proyectilesTutorial.filter(pr => !pr.destruir && pr.y < LH && pr.y > 0);

                return;
            }

            if (esperandoSiguienteNivel || gameOver) return;

            // CONTROL DEL JUGADOR
            let moviendose = false;
            if (keys["KeyA"] || keys["ArrowLeft"]) { player.x -= player.speed; moviendose = true; }
            if (keys["KeyD"] || keys["ArrowRight"]) { player.x += player.speed; moviendose = true; }

            if (moviendose && contadorFrames % 3 === 0) {
                rastroJugador.push({ x: player.x, y: player.y, alpha: 0.6, radius: player.radius });
            }

            rastroJugador.forEach(rt => rt.alpha -= 0.05);
            rastroJugador = rastroJugador.filter(rt => rt.alpha > 0);

            player.vy += 0.38;
            player.y += player.vy;

            if (player.x < 15) player.x = 15;
            if (player.x > LW - 15) player.x = LW - 15;

            if (player.y > LH + 15) {
                perderVida();
                return;
            }

            if (contadorFrames > 30) {
                nivel.laseres.forEach(l => {
                    let ciclo = Math.floor(contadorFrames / l.intervalo) % 2;
                    let estaActivo = (ciclo === 0);

                    if (estaActivo) {
                        if (
                            player.x > l.x1 && player.x < l.x2 &&
                            Math.abs(player.y - l.y1) < player.radius + 4
                        ) {
                            perderVida();
                        }
                    }
                });
            }

            // COMBATE CON BOSS EN NIVEL 7
            if (nivelActual === 7 && !boss.derrotado && boss.animDefeatedTimer === 0) {
                actualizarUlti();
                let pctVida = boss.vida / boss.vidaMax;

                if (pctVida > 0.75) boss.fase = 1;
                else if (pctVida > 0.50) boss.fase = 2;
                else if (pctVida > 0.25) boss.fase = 3;
                else boss.fase = 4;

                let velOscilacion = 0.02 * boss.fase;
                let amplitud = 190 + (boss.fase >= 3 ? 40 : 0);
                boss.x = 400 + Math.sin(contadorFrames * velOscilacion) * amplitud;

                if (boss.fase >= 3 && Math.random() < 0.65) {
                    particulasHumo.push({
                        x: boss.x + (Math.random() - 0.5) * 45,
                        y: boss.y + (Math.random() - 0.5) * 20,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: -Math.random() * 2 - 0.6,
                        radius: Math.random() * 6 + 4,
                        alpha: 0.8,
                        color: Math.random() < 0.4 ? "rgba(255, 60, 0, " : "rgba(80, 80, 90, "
                    });
                }

                particulasHumo.forEach(ph => {
                    ph.x += ph.vx;
                    ph.y += ph.vy;
                    ph.radius += 0.15;
                    ph.alpha -= 0.02;
                });
                particulasHumo = particulasHumo.filter(ph => ph.alpha > 0);

                if (boss.fase >= 2 && contadorFrames % (boss.fase >= 3 ? 75 : 110) === 0) {
                    rayosCaoticos.push({
                        x: 180 + Math.random() * 440,
                        advertencia: 45,
                        duracion: 30,
                        ancho: 16
                    });
                }

                rayosCaoticos.forEach(ry => {
                    if (ry.advertencia > 0) {
                        ry.advertencia--;
                    } else if (ry.duracion > 0) {
                        ry.duracion--;
                        if (Math.abs(player.x - ry.x) < player.radius + ry.ancho / 2) {
                            perderVida();
                        }
                    }
                });
                rayosCaoticos = rayosCaoticos.filter(ry => ry.duracion > 0);

                if (boss.fase === 4 && contadorFrames % 95 === 0) {
                    let offsetDronX = Math.sin(contadorFrames * 0.05) * 15;
                    let dLeftX = boss.x - 70 + offsetDronX;
                    let dRightX = boss.x + 70 - offsetDronX;
                    let dY = boss.y + 25;

                    [dLeftX, dRightX].forEach(dx => {
                        proyectilesBoss.push({
                            x: dx,
                            y: dY,
                            vx: (Math.random() - 0.5) * 1.2,
                            vy: 3.0,
                            radius: 7,
                            esRojo: false,
                            devuelto: false,
                            esParry: false
                        });
                    });
                    playSound('shoot');
                }

                let cadencia = boss.fase === 1 ? 120 : (boss.fase === 2 ? 90 : (boss.fase === 3 ? 70 : 55));
                if (contadorFrames % cadencia === 0) {
                    let esRojo = Math.random() < (0.35 + boss.fase * 0.08);
                    proyectilesBoss.push({
                        x: boss.x,
                        y: boss.y,
                        vx: (Math.random() - 0.5) * (1.8 * boss.fase),
                        vy: 2.2 * (esRojo ? 1.3 : 1.0) * (1 + boss.fase * 0.12),
                        radius: esRojo ? 10 : 8,
                        esRojo: esRojo,
                        devuelto: false,
                        esParry: false
                    });
                    playSound('shoot');
                }

                proyectilesBoss.forEach(pr => {
                    if (pr.devuelto) {
                        pr.vx = (boss.x - pr.x) * 0.14; // Auto-guiado
                    }

                    pr.x += pr.vx;
                    pr.y += pr.vy;

                    if (!pr.devuelto) {
                        let d = Math.hypot(player.x - pr.x, player.y - pr.y);
                        if (d < player.radius + pr.radius) {
                            perderVida();
                        }
                    } else {
                        let dBoss = Math.hypot(boss.x - pr.x, boss.y - pr.y);
                        if (dBoss < boss.radius + pr.radius) {
                            boss.vida--;
                            pr.destruir = true;
                            temblorPantalla = pr.esParry ? 18 : 10;
                            playSound('explosion');

                            let cantidadParticulas = pr.esParry ? 30 : 15;
                            for (let i = 0; i < cantidadParticulas; i++) {
                                particulasBoss.push({
                                    x: boss.x,
                                    y: boss.y,
                                    vx: (Math.random() - 0.5) * (pr.esParry ? 14 : 9),
                                    vy: (Math.random() - 0.5) * (pr.esParry ? 14 : 9),
                                    alpha: 1.0,
                                    color: pr.esParry ? "#00f0ff" : "#ff0055"
                                });
                            }

                            if (boss.vida <= 0) {
                                boss.animDefeatedTimer = 180; // 3 segundos de explosión/colapso
                            }
                        }
                    }
                });
                proyectilesBoss = proyectilesBoss.filter(pr => !pr.destruir && pr.y > -50 && pr.y < LH + 50);
            }

            nivel.plataformas.forEach(p => {
                if (nivelActual !== 7) {
                    if (p.alphaVisibilidad > 0) {
                        p.alphaVisibilidad -= 0.02; 
                        if (p.alphaVisibilidad < 0) p.alphaVisibilidad = 0;
                    }
                } else {
                    p.alphaVisibilidad = 1.0;
                }
            });

            if (nivelActual !== 7 || !boss.derrotado) {
                if (nivel.cristal.alphaVisibilidad > 0) {
                    nivel.cristal.alphaVisibilidad -= 0.02;
                    if (nivel.cristal.alphaVisibilidad < 0) nivel.cristal.alphaVisibilidad = 0;
                }
            } else {
                nivel.cristal.alphaVisibilidad = 1.0;
            }

            // COLISIÓN PLATAFORMAS
            nivel.plataformas.forEach(p => {
                let enRangoX = player.x + player.radius > p.x && player.x - player.radius < p.x + p.w;

                if (
                    enRangoX &&
                    player.y + player.radius >= p.y &&
                    player.y + player.radius <= p.y + p.h / 2 &&
                    player.vy > 0
                ) {
                    player.y = p.y - player.radius;
                    player.vy = 0;
                    if (keys["KeyW"] || keys["ArrowUp"]) {
                        player.vy = -10;
                        playSound('jump');
                    }
                }

                if (
                    enRangoX &&
                    player.y - player.radius <= p.y + p.h &&
                    player.y - player.radius >= p.y + p.h / 2 &&
                    player.vy < 0
                ) {
                    player.y = p.y + p.h + player.radius;
                    player.vy = 0;
                }

                if (player.y + player.radius > p.y && player.y - player.radius < p.y + p.h) {
                    if (player.x + player.radius > p.x && player.x < p.x) {
                        player.x = p.x - player.radius;
                    }
                    if (player.x - player.radius < p.x + p.w && player.x > p.x + p.w) {
                        player.x = p.x + p.w + player.radius;
                    }
                }
            });

            if (nivelActual === 1 && player.y > LH - 20) {
                player.y = LH - 20;
                player.vy = 0;
                if (keys["KeyW"] || keys["ArrowUp"]) {
                    player.vy = -10;
                    playSound('jump');
                }
            }

            let cx = nivel.cristal.x + nivel.cristal.w / 2;
            let cy = nivel.cristal.y + nivel.cristal.h / 2;

            ondas.forEach(o => {
                o.radioActual += 4.5;
                o.alpha = 1 - (o.radioActual / o.radioMax);

                nivel.plataformas.forEach(p => {
                    let distP = Math.hypot(o.x - (p.x + p.w/2), o.y - (p.y + p.h/2));
                    if (Math.abs(o.radioActual - distP) < 50) {
                        p.alphaVisibilidad = 1.0; 
                    }
                });

                let distC = Math.hypot(o.x - cx, o.y - cy);
                if (Math.abs(o.radioActual - distC) < 55) {
                    nivel.cristal.alphaVisibilidad = 1.0;
                }
            });
            ondas = ondas.filter(o => o.radioActual < o.radioMax);

            particulasBoss.forEach(pt => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.04;
            });
            particulasBoss = particulasBoss.filter(pt => pt.alpha > 0);

            visualTick(player, dirEntrada(), colorSkin());

            // ACTIVACIÓN DE PORTAL (CRISTAL)
            let distPlayerCristal = Math.hypot(player.x - cx, player.y - cy);
            if (distPlayerCristal < 50 && (nivelActual < 7 || boss.derrotado)) {
                if (!nivel.cristal.activo) {
                    playSound('portal');
                }
                nivel.cristal.activo = true;
                esperandoSiguienteNivel = true;
            }

            if ((nivel.cristal.alphaVisibilidad > 0 || boss.derrotado) && Math.random() < 0.4) {
                particulasCristal.push({
                    x: cx + (Math.random() - 0.5) * 30,
                    y: cy + (Math.random() - 0.5) * 40,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: -Math.random() * 1.2 - 0.3,
                    size: Math.random() * 3 + 1,
                    alpha: nivel.cristal.alphaVisibilidad
                });
            }

            particulasCristal.forEach(pt => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.02;
            });
            particulasCristal = particulasCristal.filter(pt => pt.alpha > 0);

            // TEXTOS FLOTANTES DE COMBO
            textosCombo.forEach(txt => {
                txt.y -= 0.8;
                txt.alpha -= 0.02;
            });
            textosCombo = textosCombo.filter(txt => txt.alpha > 0);

            // PARTICULAS DE PERDER VIDA
            particulasPerderVida.forEach(pt => {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.03;
            });
            particulasPerderVida = particulasPerderVida.filter(pt => pt.alpha > 0);
        }

        function dibujarBoton(x, y, w, h, texto, colorBase) {
            let esHover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;

            ctx.save();
            
            let grad = ctx.createLinearGradient(x, y, x + w, y + h);
            if (esHover) {
                grad.addColorStop(0, colorBase);
                grad.addColorStop(1, "#ffffff");
            } else {
                grad.addColorStop(0, "rgba(15, 23, 42, 0.9)");
                grad.addColorStop(1, "rgba(30, 41, 59, 0.9)");
            }

            ctx.shadowColor = colorBase;
            ctx.shadowBlur = esHover ? 25 : 8;

            let c = 10;
            ctx.beginPath();
            ctx.moveTo(x + c, y);
            ctx.lineTo(x + w - c, y);
            ctx.lineTo(x + w, y + c);
            ctx.lineTo(x + w, y + h - c);
            ctx.lineTo(x + w - c, y + h);
            ctx.lineTo(x + c, y + h);
            ctx.lineTo(x, y + h - c);
            ctx.lineTo(x, y + c);
            ctx.closePath();

            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.strokeStyle = esHover ? "#ffffff" : colorBase;
            ctx.lineWidth = esHover ? 2.5 : 1.5;
            ctx.stroke();

            if (esHover) {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x + w / 2 - 20, y + h - 3, 40, 2);
            }

            ctx.fillStyle = esHover ? "#000000" : "#ffffff";
            ctx.font = "bold 15px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(texto, x + w / 2, y + h / 2);

            ctx.restore();
        }

        function dibujar() {
            ctx.setTransform(escalaRender, 0, 0, escalaRender, 0, 0);
            ctx.save();
            
            if (temblorPantalla > 0) {
                let offsetX = (Math.random() - 0.5) * temblorPantalla;
                let offsetY = (Math.random() - 0.5) * temblorPantalla;
                ctx.translate(offsetX, offsetY);
            }

            ctx.fillStyle = "#020204";
            ctx.fillRect(0, 0, LW, LH);
            dibujarFondoPro();

            estrellasFondo.forEach(st => {
                ctx.fillStyle = "#ffffff";
                ctx.globalAlpha = Math.max(0.1, Math.min(1, st.alpha));
                ctx.beginPath();
                ctx.arc(st.x, st.y, st.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            let gradienteVacio = ctx.createLinearGradient(0, LH - 50, 0, LH);

            // BOTÓN SILENCIO DE AUDIO EN LA ESQUINA SUPERIOR DERECHA

                dibujarBoton(280, 325, 240, 48, "MULTIJUGADOR 2P", "#b000ff");

            if (estadoJuego === "TUTORIAL") {

            // ANIMACIÓN Y PANTALLA DE VICTORIA TOTAL
            if (juegoTerminado) {
                ctx.save();
                ctx.fillStyle = "#ffd700";

                fuegosArtificiales.forEach(fw => {
                    ctx.save();

            nivel.plataformas.forEach(p => {
                let visible = p.alphaVisibilidad > 0 || nivelActual === 7;

                if (visible) {
                    ctx.save();
                    ctx.fillStyle = nivel.color;
                    ctx.shadowColor = nivel.color;
                    ctx.shadowBlur = 15;
                    ctx.globalAlpha = (nivelActual === 7) ? 1.0 : Math.max(0.1, p.alphaVisibilidad);

            particulasHumo.forEach(ph => {

            rayosCaoticos.forEach(ry => {
                ctx.save();
                if (ry.advertencia > 0) {
                    ctx.strokeStyle = "rgba(255, 0, 85, 0.4)";

                    ctx.moveTo(ry.x, 0);

                } else {

                    ctx.shadowColor = "#ff0055";
                    ctx.shadowBlur = 25;
                    ctx.fillRect(ry.x - ry.ancho / 2, 0, ry.ancho, LH);

            // ANIMACIÓN Y DIBUJO DEL BOSS EN NIVEL 7
            if (nivelActual === 7 && (!boss.derrotado || boss.animDefeatedTimer > 0)) {
                ctx.save();
                let pctVida = Math.max(0, boss.vida / boss.vidaMax);
                let colorBoss = boss.fase === 4 ? "#ff0000" : (boss.fase === 3 ? "#ff3300" : (boss.fase === 2 ? "#ff5500" : "#ff0055"));

                // SI ESTÁ EN COLAPSO DE DERROTA
                if (boss.animDefeatedTimer > 0) {
                    let osc = Math.sin(boss.animDefeatedTimer * 0.5) * 8;
                    ctx.translate(boss.x + osc, boss.y);
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "#00f0ff";
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(0, 0, boss.radius + Math.random() * 8, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = colorBoss;
                    ctx.shadowColor = colorBoss;
                    ctx.shadowBlur = 30 + boss.fase * 10;
                    ctx.beginPath();
                    ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = boss.fase >= 3 ? "#ffcc00" : "#ffffff";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(boss.x, boss.y, boss.radius + 14, boss.radius + 5, contadorFrames * (0.04 * boss.fase), 0, Math.PI * 2);
                    ctx.stroke();

                    if (boss.fase >= 2) {
                        ctx.strokeStyle = "#00f0ff";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.ellipse(boss.x, boss.y, boss.radius + 6, boss.radius + 16, -contadorFrames * 0.06, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(boss.x, boss.y, 8 + Math.sin(contadorFrames * 0.2) * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                if (boss.fase === 4 && boss.animDefeatedTimer === 0) {
                    let offsetDronX = Math.sin(contadorFrames * 0.05) * 15;
                    let dLeftX = boss.x - 70 + offsetDronX;
                    let dRightX = boss.x + 70 - offsetDronX;
                    let dY = boss.y + 25;

                    [dLeftX, dRightX].forEach(dx => {
                        ctx.save();
                        ctx.fillStyle = "#ffcc00";
                        ctx.shadowColor = "#ffcc00";
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(dx, dY, 12, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = "#ffffff";
                        ctx.beginPath();
                        ctx.arc(dx, dY, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });
                }

                proyectilesBoss.forEach(pr => {
                    ctx.save();
                    if (!pr.devuelto) {
                        ctx.fillStyle = pr.esRojo ? "#ff0033" : "#ffcc00";
                        ctx.shadowColor = pr.esRojo ? "#ff0033" : "#ffcc00";
                    } else {
                        ctx.fillStyle = pr.esParry ? "#00f0ff" : "#ffffff";
                        ctx.shadowColor = pr.esParry ? "#00f0ff" : "#ffffff";
                    }
                    ctx.shadowBlur = 18;
                    ctx.beginPath();
                    ctx.arc(pr.x, pr.y, pr.radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (pr.esRojo && !pr.devuelto) {
                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(pr.x, pr.y, pr.radius + 4, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                if (boss.animDefeatedTimer === 0) {
                    let barW = 240;
                    let barH = 14;
                    let barX = LW / 2 - barW / 2;
                    let barY = 55;

                    ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                    ctx.fillRect(barX, barY, barW, barH);
                    ctx.fillStyle = colorBoss;
                    ctx.fillRect(barX, barY, barW * pctVida, barH);
                    ctx.strokeStyle = "#ffffff";
                    ctx.strokeRect(barX, barY, barW, barH);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "12px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(`NÚCLEO ELYSIUM - FASE ${boss.fase} / 4 (${boss.vida} / ${boss.vidaMax} HP)`, LW / 2, barY - 6);
                }
            }

            particulasBoss.forEach(pt => {
                ctx.fillStyle = pt.color || "#ff0055";
                ctx.globalAlpha = pt.alpha;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            if (nivelActual < 7 || boss.derrotado) {
                let cx = nivel.cristal.x + nivel.cristal.w / 2;
                let cy = nivel.cristal.y + nivel.cristal.h / 2;
                let visibilidadPortal = nivel.cristal.activo ? 1.0 : nivel.cristal.alphaVisibilidad;

                if (visibilidadPortal > 0 || (nivelActual === 7 && boss.derrotado)) {
                    let alphaFinal = (nivelActual === 7 && boss.derrotado) ? 1.0 : Math.max(0.1, visibilidadPortal);
                    let colorPrincipal = nivel.cristal.activo ? "#00ff88" : nivel.color;

                    ctx.save();
                    ctx.globalAlpha = alphaFinal;

                    let flotacion = Math.sin(contadorFrames * 0.05) * 4;
                    ctx.translate(cx, cy + flotacion);

                    let angulo = contadorFrames * 0.03;
                    ctx.strokeStyle = colorPrincipal;
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = colorPrincipal;
                    ctx.shadowBlur = 15;

                    ctx.beginPath();
                    ctx.ellipse(0, 0, 24, 8, angulo, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.fillStyle = nivel.cristal.activo ? "#ffffff" : colorPrincipal;
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.moveTo(0, -22);
                    ctx.lineTo(12, 0);
                    ctx.lineTo(0, 22);
                    ctx.lineTo(-12, 0);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                }
            }

            ondas.forEach(o => {
                ctx.beginPath();
                ctx.arc(o.x, o.y, o.radioActual, 0, Math.PI * 2);
                ctx.strokeStyle = nivel.color;
                ctx.globalAlpha = o.alpha * 0.5;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.globalAlpha = 1.0;

            dibujarUlti();

            // RASTRO DE MOVIMIENTO DEL JUGADOR

                ctx.globalAlpha = rt.alpha * 0.4;
                ctx.fillStyle = "#00f0ff";

                ctx.arc(rt.x, rt.y, rt.radius, 0, Math.PI * 2);

            // ANIMACIÓN DE RESPAWN HOLOGRÁFICO AL PERDER VIDA
            if (animRespawnTimer > 0) {
                animRespawnTimer--;
                ctx.save();
                ctx.strokeStyle = "#00f0ff";
                ctx.lineWidth = 2;
                ctx.globalAlpha = animRespawnTimer / 40;
                let radioHolo = (40 - animRespawnTimer) * 1.5;
                ctx.beginPath();
                ctx.arc(player.x, player.y, radioHolo, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "rgba(0, 240, 255, 0.2)";
                ctx.fillRect(player.x - 15, 0, 30, LH);
                ctx.restore();
            }

            // DIBUJO DEL JUGADOR
            dibujarFx();
            dibujarPersonaje(player, colorSkin(), nivel.color, skin);

            // PARTICULAS DE PERDER VIDA
            particulasPerderVida.forEach(pt => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.fillStyle = pt.color;

                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);

            // TEXTOS FLOTANTES DE COMBO PARRY
            textosCombo.forEach(txt => {

                ctx.fillStyle = "#00f0ff";

                ctx.fillStyle = "#00ff88";

                ctx.restore();
            }

            ctx.restore();
