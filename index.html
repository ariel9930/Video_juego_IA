        // --- MODO MULTIJUGADOR LOCAL (2 JUGADORES, COOP VS NÚCLEO) ---
        let mp = null;
        const MP_PLAT = { x: 100, y: 380, w: 600, h: 24 };
        const MP_CTRL = [
            { izq: "KeyA", der: "KeyD", salto: "KeyW" },
            { izq: "ArrowLeft", der: "ArrowRight", salto: "ArrowUp" }
        ];

        function iniciarMulti() {
            estadoJuego = "MULTI";
            contadorFrames = 0;
            temblorPantalla = 0;
            ultFlash = 0;
            mp = {
                jug: [0, 1].map(i => ({ x: 300 + i * 200, y: 350, vy: 0, vidas: 3, vivo: true, inv: 0, parrys: 0, dano: 0, carga: 0, color: i === 0 ? colorSkin() : colorJ2() })),
                boss: { x: 400, y: 100, radius: 40, vida: 20, vidaMax: 20, fase: 1 },
                proy: [], rayos: [], parts: [], textos: [], fin: null, finTimer: 0
            };
        }

        function mpExplosion(x, y, n, color, vel) {
            for (let k = 0; k < n; k++) {
                mp.parts.push({ x: x, y: y, vx: (Math.random() - 0.5) * vel, vy: (Math.random() - 0.5) * vel, alpha: 1, color: color });
            }
        }

        function mpGolpe(i, ignorarInv) {
            let p = mp.jug[i];
            if (!p.vivo || ((p.inv > 0 || mp.ult) && !ignorarInv)) return; // el escudo de la ulti protege al equipo
            p.vidas--;
            playSound('hit');
            temblorPantalla = 8;
            mpExplosion(p.x, p.y, 30, p.color, 10);
            if (p.vidas <= 0) {
                p.vivo = false;
                if (!mp.jug.some(j => j.vivo)) { mp.fin = "DERROTA"; mp.finTimer = 0; }
            } else {
                p.x = 300 + i * 200; p.y = 350; p.vy = 0; p.inv = 90;
            }
        }

        function mpParry(i) {
            let p = mp.jug[i];
            if (!p.vivo || mp.fin) return;
            if (p.carga >= 5 && !mp.ult) { mpUlti(i); return; }
            let ok = false;
            mp.proy.forEach(pr => {
                if (!pr.devuelto && pr.esRojo && Math.hypot(p.x - pr.x, p.y - pr.y) < 85) {
                    pr.devuelto = true;
                    pr.por = i;
                    pr.esParry = pr.esRojo;
                    pr.vy = pr.esRojo ? -14 : -9.5;
                    ok = true;
                }
            });
            if (ok) {
                p.parrys++;
                p.carga = Math.min(5, p.carga + 1);
                fxAnillo(p.x, p.y, p.color, 60, 18, false);
                temblorPantalla = 7;
                playSound('parry');
                mp.textos.push({ text: "PARRY!", x: p.x, y: p.y - 24, alpha: 1, color: p.color });
            }
        }

        function multiTecla(code) {
            if (code === "Escape") { estadoJuego = "MENU"; return; }
            if (mp.fin) {
                if (mp.finTimer > 60 && (code === "Space" || code === "Enter")) iniciarMulti();
                return;
            }
            if (code === "Space") mpParry(0);
            if (code === "Enter" || code === "NumpadEnter") mpParry(1);
        }

        function multiClick() {
            if (!mp || !mp.fin || mp.finTimer < 30) return;
            if (mouseX >= 220 && mouseX <= 390 && mouseY >= 330 && mouseY <= 375) {
                playSound('button');
                iniciarMulti();
            } else if (mouseX >= 410 && mouseX <= 580 && mouseY >= 330 && mouseY <= 375) {
                playSound('button');
                estadoJuego = "MENU";
            }
        }

        function actualizarMulti() {
            if (!mp) return;
            let b = mp.boss;

            mp.parts.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.03; });
            mp.parts = mp.parts.filter(pt => pt.alpha > 0);
            mp.textos.forEach(t => { t.y -= 0.8; t.alpha -= 0.02; });
            mp.textos = mp.textos.filter(t => t.alpha > 0);

            if (mp.ult) {
                let u = mp.ult;
                let pu = mp.jug[u.por];
                if (pu.vivo) { u.x = pu.x; u.y = pu.y; }
                let fin = avanzarUlti(u, b.x, b.y, () => {
                    mp.proy.forEach(pr => mpExplosion(pr.x, pr.y, 6, pr.esRojo ? "#ff0033" : "#ffcc00", 8));
                    mp.proy = [];
                    mp.rayos = [];
                    let d = Math.min(4, b.vida);
                    b.vida -= d;
                    pu.dano += d;
                    mpExplosion(b.x, b.y, 45, "#ffd700", 16);
                    mp.textos.push({ text: "¡ULTI: NOVA ELYSIUM!", x: u.x, y: u.y - 40, alpha: 1, color: u.color });
                    if (b.vida <= 0) {
                        b.vida = 0;
                        mp.fin = "VICTORIA";
                        mp.finTimer = 0;
                        mp.ult = null;
                        playSound('win');
                    }
                }, mp.parts);
                if (fin) mp.ult = null;
            }

            if (mp.fin) {
                mp.finTimer++;
                if (mp.fin === "VICTORIA" && mp.finTimer < 150 && contadorFrames % 8 === 0) {
                    mpExplosion(b.x + (Math.random() - 0.5) * 80, b.y + (Math.random() - 0.5) * 80, 12, Math.random() < 0.5 ? "#00f0ff" : "#ff0055", 12);
                }
                return;
            }

            // Jugadores
            mp.jug.forEach((p, i) => {
                if (!p.vivo) return;
                let c = MP_CTRL[i];
                if (keys[c.izq]) p.x -= player.speed;
                if (keys[c.der]) p.x += player.speed;
                p.x = Math.max(15, Math.min(LW - 15, p.x));
                p.vy += 0.38;
                p.y += p.vy;
                if (p.inv > 0) p.inv--;

                let P = MP_PLAT;
                if (p.x + 12 > P.x && p.x - 12 < P.x + P.w && p.y + 12 >= P.y && p.y + 12 <= P.y + P.h / 2 && p.vy > 0) {
                    p.y = P.y - 12;
                    p.vy = 0;
                    if (keys[c.salto]) { p.vy = -10; playSound('jump'); }
                }
                visualTick(p, ((keys[c.der] ? 1 : 0) - (keys[c.izq] ? 1 : 0)), p.color);
                if (p.y > LH + 15) mpGolpe(i, true);
            });

            // Jefe
            let vivos = mp.jug.filter(j => j.vivo);
            let pct = b.vida / b.vidaMax;
            b.fase = pct > 0.75 ? 1 : (pct > 0.5 ? 2 : (pct > 0.25 ? 3 : 4));
            b.x = 400 + Math.sin(contadorFrames * 0.02 * b.fase) * (190 + (b.fase >= 3 ? 40 : 0));

            if (b.fase >= 2 && contadorFrames % (b.fase >= 3 ? 75 : 110) === 0) {
                mp.rayos.push({ x: 180 + Math.random() * 440, adv: 45, dur: 30, ancho: 16 });
            }
            mp.rayos.forEach(ry => {
                if (ry.adv > 0) { ry.adv--; }
                else if (ry.dur > 0) {
                    ry.dur--;
                    mp.jug.forEach((p, i) => {
                        if (p.vivo && Math.abs(p.x - ry.x) < 12 + ry.ancho / 2) mpGolpe(i);
                    });
                }
            });
            mp.rayos = mp.rayos.filter(ry => ry.dur > 0);

            let cad = [0, 100, 80, 62, 48][b.fase];
            if (contadorFrames % cad === 0 && vivos.length > 0) {
                let n = b.fase === 4 ? 2 : 1;
                for (let k = 0; k < n; k++) {
                    let t = vivos[Math.floor(Math.random() * vivos.length)];
                    let esRojo = Math.random() < 0.35 + b.fase * 0.08;
                    let vy = 2.2 * (esRojo ? 1.3 : 1.0) * (1 + b.fase * 0.12);
                    let tf = Math.max(20, (t.y - b.y) / vy);
                    mp.proy.push({
                        x: b.x, y: b.y,
                        vx: (t.x - b.x) / tf + (Math.random() - 0.5) * 1.5,
                        vy: vy,
                        radius: esRojo ? 10 : 8,
                        esRojo: esRojo, devuelto: false, esParry: false, por: -1
                    });
                }
                playSound('shoot');
            }

            mp.proy.forEach(pr => {
                if (pr.devuelto) pr.vx = (b.x - pr.x) * 0.14;
                pr.x += pr.vx;
                pr.y += pr.vy;

                if (!pr.devuelto) {
                    mp.jug.forEach((p, i) => {
                        if (p.vivo && p.inv <= 0 && Math.hypot(p.x - pr.x, p.y - pr.y) < 12 + pr.radius) {
                            pr.destruir = true;
                            mpGolpe(i);
                        }
                    });
                } else if (Math.hypot(b.x - pr.x, b.y - pr.y) < b.radius + pr.radius) {
                    b.vida--;
                    pr.destruir = true;
                    if (pr.por >= 0) mp.jug[pr.por].dano++;
                    temblorPantalla = pr.esParry ? 18 : 10;
                    playSound('explosion');
                    mpExplosion(b.x, b.y, pr.esParry ? 30 : 15, pr.esParry ? "#00f0ff" : "#ff0055", pr.esParry ? 14 : 9);
                    if (b.vida <= 0) {
                        b.vida = 0;
                        mp.fin = "VICTORIA";
                        mp.finTimer = 0;
                        mp.rayos = [];
                        playSound('win');
                    }
                }
            });
            mp.proy = mp.proy.filter(pr => !pr.destruir && pr.y > -50 && pr.y < LH + 50);
            if (mp.fin) mp.proy = [];
        }

        function dibujarMulti() {
            if (!mp) return;
            let b = mp.boss;
            let colorBoss = b.fase === 4 ? "#ff0000" : (b.fase === 3 ? "#ff3300" : (b.fase === 2 ? "#ff5500" : "#ff0055"));

            // Etiqueta de audio
            ctx.save();
            ctx.fillStyle = audioMuted ? "#ff0055" : "#00f0ff";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(audioMuted ? "MUTE [x]" : "AUDIO [on]", LW - 15, 25);
            ctx.restore();

            // Plataforma
            ctx.save();
            ctx.fillStyle = "#00f0ff";
            ctx.shadowColor = "#00f0ff";
            ctx.shadowBlur = 15;
            ctx.fillRect(MP_PLAT.x, MP_PLAT.y, MP_PLAT.w, MP_PLAT.h);
            ctx.restore();

            // Rayos
            mp.rayos.forEach(ry => {
                ctx.save();
                if (ry.adv > 0) {
                    ctx.strokeStyle = "rgba(255, 0, 85, 0.4)";
                    ctx.setLineDash([6, 6]);
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(ry.x, 0);
                    ctx.lineTo(ry.x, LH);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "#ff0055";
                    ctx.shadowColor = "#ff0055";
                    ctx.shadowBlur = 25;
                    ctx.fillRect(ry.x - ry.ancho / 2, 0, ry.ancho, LH);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(ry.x - 2, 0, 4, LH);
                }
                ctx.restore();
            });

            // Jefe
            ctx.save();
            if (mp.fin === "VICTORIA") {
                ctx.globalAlpha = Math.max(0, 1 - mp.finTimer / 120);
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "#00f0ff";
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius + Math.random() * 8, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = colorBoss;
                ctx.shadowColor = colorBoss;
                ctx.shadowBlur = 30 + b.fase * 10;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = b.fase >= 3 ? "#ffcc00" : "#ffffff";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(b.x, b.y, b.radius + 14, b.radius + 5, contadorFrames * 0.04 * b.fase, 0, Math.PI * 2);
                ctx.stroke();
                if (b.fase >= 2) {
                    ctx.strokeStyle = "#00f0ff";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(b.x, b.y, b.radius + 6, b.radius + 16, -contadorFrames * 0.06, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(b.x, b.y, 8 + Math.sin(contadorFrames * 0.2) * 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            if (mp.ult) dibujarUltiFx(mp.ult, b.x, b.y);
            dibujarFlashUlti();
            dibujarFx();

            // Proyectiles
            mp.proy.forEach(pr => {
                ctx.save();
                let col = pr.devuelto ? (pr.esParry ? "#00f0ff" : "#ffffff") : (pr.esRojo ? "#ff0033" : "#ffcc00");
                ctx.fillStyle = col;
                ctx.shadowColor = col;
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(pr.x, pr.y, pr.radius, 0, Math.PI * 2);
                ctx.fill();
                if (pr.esRojo && !pr.devuelto) {
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(pr.x, pr.y, pr.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Jugadores
            mp.jug.forEach((p, i) => {
                if (!p.vivo) return;
                if (p.inv > 0 && Math.floor(p.inv / 5) % 2 === 0) return;
                dibujarPersonaje(p, p.color, p.color, i === 0 ? skin : SKIN_J2);
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("J" + (i + 1), p.x, p.y - 38);
                if (p.carga >= 5) {
                    ctx.strokeStyle = "#ffd700";
                    ctx.shadowColor = "#ffd700";
                    ctx.shadowBlur = 15;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 19 + Math.sin(contadorFrames * 0.25) * 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Partículas y textos
            mp.parts.forEach(pt => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            mp.textos.forEach(t => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, t.alpha);
                ctx.fillStyle = t.color;
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 10;
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(t.text, t.x, t.y);
                ctx.restore();
            });

            // HUD
            ctx.save();
            ctx.font = "14px sans-serif";
            ctx.textAlign = "left";
            mp.jug.forEach((p, i) => {
                ctx.fillStyle = p.color;
                ctx.fillText(`J${i + 1} VIDAS: ${p.vivo ? "❤️ ".repeat(Math.max(0, p.vidas)) : "ELIMINADO"}`, 25, 30 + i * 22);
                for (let k = 0; k < 5; k++) {
                    ctx.beginPath();
                    ctx.arc(222 + k * 13, 25 + i * 22, 4, 0, Math.PI * 2);
                    if (k < p.carga) { ctx.fillStyle = "#ffd700"; ctx.fill(); }
                    else { ctx.strokeStyle = p.color; ctx.lineWidth = 1; ctx.stroke(); }
                }
            });
            if (!mp.fin) {
                let pctVida = Math.max(0, b.vida / b.vidaMax);
                let barW = 240, barH = 14, barX = LW / 2 - barW / 2, barY = 55;
                ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                ctx.fillRect(barX, barY, barW, barH);
                ctx.fillStyle = colorBoss;
                ctx.fillRect(barX, barY, barW * pctVida, barH);
                ctx.strokeStyle = "#ffffff";
                ctx.strokeRect(barX, barY, barW, barH);
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`NÚCLEO ELYSIUM - FASE ${b.fase} / 4 (${b.vida} / ${b.vidaMax} HP)`, LW / 2, barY - 6);
            }
            ctx.fillStyle = "#8892b0";
            ctx.font = "12px sans-serif";
            ctx.textAlign = "center";
            ctx.font = "11px sans-serif";
            ctx.fillText("J1: A/D · W · ESPACIO     |     J2: ←/→ · ↑ · ENTER     |     Parry solo a esferas ROJAS · 5 parrys = ULTI     |     ESC: menú", LW / 2, 470);
            ctx.restore();

            // Pantalla final
            if (mp.fin) {
                let gano = mp.fin === "VICTORIA";
                ctx.save();
                ctx.fillStyle = "rgba(5, 5, 12, 0.75)";
                ctx.fillRect(0, 0, LW, LH);
                ctx.textAlign = "center";
                ctx.fillStyle = gano ? "#ffd700" : "#ff0055";
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 25;
                ctx.font = "bold 30px sans-serif";
                ctx.fillText(gano ? "¡VICTORIA COOPERATIVA!" : "¡DERROTA!", LW / 2, 150);
                ctx.shadowBlur = 0;
                ctx.font = "16px sans-serif";
                mp.jug.forEach((p, i) => {
                    ctx.fillStyle = p.color;
                    ctx.fillText(`J${i + 1}  —  Parrys: ${p.parrys}  ·  Daño al Núcleo: ${p.dano}`, LW / 2, 205 + i * 30);
                });
                ctx.restore();
                dibujarBoton(220, 330, 170, 45, "JUGAR DE NUEVO", "#00ff88");
                dibujarBoton(410, 330, 170, 45, "VOLVER AL MENÚ", "#ff0055");
            }
        }

        // --- ULTI "NOVA ELYSIUM" (se carga con 5 parrys, se lanza con ESPACIO / tecla de parry) ---
        let ultCarga = 0;
        let ult = null;
        let ultFlash = 0;

        function avanzarUlti(u, bx, by, alGolpear, particulas) {
            u.t++;
            if (u.t < 40) {
                // Fase de carga: chispas que convergen hacia el jugador
                if (u.t % 2 === 0) {
                    for (let k = 0; k < 2; k++) {
                        let a = Math.random() * Math.PI * 2;
                        let d = 90 + Math.random() * 40;
                        particulas.push({ x: u.x + Math.cos(a) * d, y: u.y + Math.sin(a) * d, vx: -Math.cos(a) * 3.4, vy: -Math.sin(a) * 3.4, alpha: 1, color: u.color });
                    }
                }
                temblorPantalla = Math.max(temblorPantalla, u.t / 6);
            } else if (u.t === 40) {
                // Disparo
                ultFlash = 14;
                temblorPantalla = 30;
                playSound('ulti');
                alGolpear();
            } else if (u.t < 90) {
                // Rayo activo: chispas a lo largo del haz
                for (let k = 0; k < 3; k++) {
                    let f = Math.random();
                    particulas.push({ x: u.x + (bx - u.x) * f, y: u.y + (by - u.y) * f, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, alpha: 1, color: Math.random() < 0.5 ? "#ffffff" : u.color });
                }
                temblorPantalla = Math.max(temblorPantalla, 6);
            }
            return u.t >= 95;
        }

        function dibujarUltiFx(u, bx, by) {
            let t = u.t;
            ctx.save();
            if (t < 40) {
                // Carga: pantalla oscura, anillos que convergen, estrella giratoria y núcleo de luz
                ctx.fillStyle = `rgba(0, 0, 12, ${Math.min(0.5, t / 50)})`;
                ctx.fillRect(0, 0, LW, LH);
                ctx.translate(u.x, u.y);
                ctx.strokeStyle = u.color;
                ctx.shadowColor = u.color;
                ctx.shadowBlur = 20;
                ctx.lineWidth = 2;
                for (let k = 0; k < 3; k++) {
                    let r = 120 - ((t * 3 + k * 40) % 120);
                    ctx.globalAlpha = Math.max(0, Math.min(1, 1.2 - r / 120));
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
                ctx.rotate(t * 0.12);
                for (let k = 0; k < 6; k++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.beginPath();
                    ctx.moveTo(18, 0);
                    ctx.lineTo(18 + t * 1.1, 0);
                    ctx.stroke();
                }
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(0, 0, 6 + t * 0.45, 0, Math.PI * 2);
                ctx.fill();
            } else if (t < 90) {
                // Rayo: haz grueso con núcleo blanco, relámpagos y ondas de choque
                let p = (t - 40) / 50;
                let w = 12 + 58 * (1 - p);
                ctx.lineCap = "round";
                ctx.shadowColor = u.color;
                ctx.shadowBlur = 40;
                ctx.strokeStyle = u.color;
                ctx.globalAlpha = 0.55;
                ctx.lineWidth = w * 1.6;
                ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(bx, by); ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = w * 0.5;
                ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(bx, by); ctx.stroke();

                ctx.lineCap = "butt";
                ctx.lineWidth = 2;
                ctx.strokeStyle = u.color;
                for (let k = 0; k < 2; k++) {
                    ctx.beginPath();
                    ctx.moveTo(u.x, u.y);
                    for (let sg = 1; sg <= 8; sg++) {
                        let f = sg / 8;
                        ctx.lineTo(u.x + (bx - u.x) * f + (Math.random() - 0.5) * 60 * (1 - p),
                                   u.y + (by - u.y) * f + (Math.random() - 0.5) * 60 * (1 - p));
                    }
                    ctx.stroke();
                }

                ctx.lineWidth = 4;
                for (let k = 0; k < 2; k++) {
                    let pr = (p + k * 0.5) % 1;
                    ctx.globalAlpha = 1 - pr;
                    ctx.beginPath();
                    ctx.arc(bx, by, 30 + pr * 150, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1 - p;
                ctx.beginPath();
                ctx.arc(u.x, u.y, 18 + p * 40, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function dibujarFlashUlti() {
            if (ultFlash > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${ultFlash / 14})`;
                ctx.fillRect(0, 0, LW, LH);
                ctx.restore();
                ultFlash--;
            }
        }

        // Modo un jugador
        function lanzarUlti() {
            ult = { t: 0, x: player.x, y: player.y, color: "#ffd700" };
            ultCarga = 0;
            playSound('echo');
            textosCombo.push({ text: "¡ULTI: NOVA ELYSIUM!", x: player.x, y: player.y - 40, alpha: 1.0, scale: 1.2 });
        }

        function actualizarUlti() {
            if (!ult) return;
            ult.x = player.x;
            ult.y = player.y;
            let fin = avanzarUlti(ult, boss.x, boss.y, () => {
                proyectilesBoss.forEach(pr => {
                    for (let k = 0; k < 6; k++) {
                        particulasBoss.push({ x: pr.x, y: pr.y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, alpha: 1, color: pr.esRojo ? "#ff0033" : "#ffcc00" });
                    }
                });
                proyectilesBoss = [];
                rayosCaoticos = [];
                boss.vida = Math.max(0, boss.vida - 3);
                for (let k = 0; k < 45; k++) {
                    particulasBoss.push({ x: boss.x, y: boss.y, vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.5) * 16, alpha: 1, color: Math.random() < 0.5 ? "#ffd700" : "#ffffff" });
                }
                if (boss.vida <= 0) { boss.animDefeatedTimer = 180; ult = null; }
            }, particulasBoss);
            if (fin) ult = null;
        }

        function dibujarUlti() {
            if (nivelActual !== 7 || juegoTerminado) return;
            if (ult) dibujarUltiFx(ult, boss.x, boss.y);
            dibujarFlashUlti();

            // Medidor de ulti
            let lista = ultCarga >= 5;
            ctx.save();
            ctx.font = "12px sans-serif";
            ctx.textAlign = "left";
            ctx.fillStyle = lista ? "#ffd700" : "#8892b0";
            ctx.fillText("ULTI", 25, 52);
            for (let k = 0; k < 5; k++) {
                ctx.beginPath();
                ctx.arc(72 + k * 16, 48, 5, 0, Math.PI * 2);
                if (k < ultCarga) {
                    ctx.fillStyle = "#ffd700";
                    ctx.shadowColor = "#ffd700";
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.strokeStyle = "#8892b0";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
            if (lista) {
                ctx.globalAlpha = 0.65 + 0.35 * Math.sin(contadorFrames * 0.2);
                ctx.fillStyle = "#ffd700";
                ctx.shadowColor = "#ffd700";
                ctx.shadowBlur = 12;
                ctx.fillText("¡ULTI LISTA! Pulsa [ESPACIO]", 25, 70);
            }
            ctx.restore();
        }

        // Modo multijugador
        function mpUlti(i) {
            let p = mp.jug[i];
            p.carga = 0;
            mp.ult = { t: 0, x: p.x, y: p.y, color: p.color, por: i };
            playSound('echo');
        }

        // --- PULIDO VISUAL: personaje, salto, polvo, doble salto y fondo con parallax ---
        let fxPolvo = [];
        let fxAnillos = [];
        let camSuave = 400;

        function hexA(hex, a) {
            let n = parseInt(hex.slice(1), 16);
            return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
        }

        function visOf(e) {
            if (!e.vis) e.vis = { sx: 1, sy: 1, tilt: 0, face: 1, prevVy: 0, doble: false, dobleT: 0, t: 0 };
            return e.vis;
        }

        function dirEntrada() {
            return ((keys["KeyD"] || keys["ArrowRight"]) ? 1 : 0) - ((keys["KeyA"] || keys["ArrowLeft"]) ? 1 : 0);
        }

        function fxAnillo(x, y, color, rMax, life, plano) {
            fxAnillos.push({ x: x, y: y, color: color, rMax: rMax, life: life, max: life, plano: !!plano });
        }

        function fxPuff(x, y, vx, vy, life, r, color) {
            fxPolvo.push({ x: x, y: y, vx: vx, vy: vy, g: 0.02, life: life, max: life, r: r, color: color });
        }

        function fxAterrizaje(x, y, f, color) {
            let n = 6 + Math.floor(f * 8);
            for (let k = 0; k < n; k++) {
                let d = k % 2 === 0 ? 1 : -1;
                fxPuff(x + d * Math.random() * 8, y - 1,
                       d * (0.8 + Math.random() * 2.2 * (0.5 + f)), -Math.random() * 0.9 * (0.5 + f),
                       22 + Math.floor(Math.random() * 14), 2 + Math.random() * 2.5,
                       k % 3 === 0 ? color : "#cfe9ff");
            }
            if (f > 0.5) fxAnillo(x, y, color, 30 + f * 30, 18, true);
        }

        function actualizarFx() {
            fxPolvo.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.96; p.life--; });
            fxPolvo = fxPolvo.filter(p => p.life > 0);
            fxAnillos.forEach(a => a.life--);
            fxAnillos = fxAnillos.filter(a => a.life > 0);
        }

        function dibujarFx() {
            ctx.save();
            fxAnillos.forEach(a => {
                let t = 1 - a.life / a.max;
                let r = a.rMax * (1 - Math.pow(1 - t, 2));
                ctx.globalAlpha = Math.max(0, (1 - t) * 0.9);
                ctx.strokeStyle = a.color;
                ctx.shadowColor = a.color;
                ctx.shadowBlur = 12;
                ctx.lineWidth = 3 * (1 - t) + 1;
                ctx.beginPath();
                if (a.plano) ctx.ellipse(a.x, a.y, r, r * 0.28, 0, 0, Math.PI * 2);
                else ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.shadowBlur = 0;
            fxPolvo.forEach(p => {
                let k = Math.max(0, p.life / p.max);
                ctx.globalAlpha = k * 0.8;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * (0.5 + 0.5 * k), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        // Se llama una vez por frame, después de las colisiones
        function visualTick(e, dir, color) {
            let v = visOf(e);
            v.t++;
            let pies = e.y + 12;
            if (dir !== 0) v.face = dir;
            v.tilt += (dir * 0.16 - v.tilt) * 0.2;
            if (e.vy === 0) v.doble = false;

            let aterrizo = v.prevVy > 1.5 && e.vy <= 0;
            if (aterrizo) {
                let f = Math.min(1, v.prevVy / 9);
                v.sx = 1 + 0.45 * f;
                v.sy = 1 - 0.4 * f;
                v.doble = false;
                fxAterrizaje(e.x, pies, f, color);
            }
            // despegue (el doble salto fija prevVy para no contarse aquí)
            if (e.vy < -5 && v.prevVy > -5) {
                if (!aterrizo) { v.sx = 0.78; v.sy = 1.25; }
                for (let k = 0; k < 5; k++) {
                    let d = k % 2 === 0 ? 1 : -1;
                    fxPuff(e.x + d * 4, pies - 1, d * (0.6 + Math.random() * 1.4), -Math.random() * 0.5, 16 + Math.floor(Math.random() * 8), 2 + Math.random() * 1.5, "#cfe9ff");
                }
            }

            let aire = e.vy !== 0;
            let tsy = aire ? 1 + Math.min(0.28, Math.abs(e.vy) * 0.028) : 1;
            let tsx = aire ? 1 - (tsy - 1) * 0.7 : 1;
            v.sx += (tsx - v.sx) * 0.22;
            v.sy += (tsy - v.sy) * 0.22;

            if (!aire && dir !== 0 && v.t % 7 === 0) {
                fxPuff(e.x - dir * 6, pies - 1, -dir * 0.5 + (Math.random() - 0.5) * 0.4, -0.3, 14, 2, "#cfe9ff");
            }
            if (v.dobleT > 0) {
                v.dobleT--;
                fxPolvo.push({ x: e.x + (Math.random() - 0.5) * 10, y: e.y + 6 + (Math.random() - 0.5) * 6, vx: (Math.random() - 0.5) * 0.6, vy: 0.4, g: 0, life: 18, max: 18, r: 3.5, color: color });
            }
            v.prevVy = e.vy;
        }

        function intentarDoble(e, color) {
            let v = visOf(e);
            if (e.vy === 0 || v.doble) return;
            v.doble = true;
            e.vy = -8.6;
            v.prevVy = -8.6;
            v.dobleT = 22;
            v.sx = 0.7;
            v.sy = 1.35;
            fxAnillo(e.x, e.y + 12, color, 46, 20, true);
            fxAnillo(e.x, e.y, color, 28, 14, false);
            for (let k = 0; k < 14; k++) {
                let a = Math.PI * (0.1 + 0.8 * Math.random());
                let sp = 1.2 + Math.random() * 2.6;
                fxPolvo.push({ x: e.x, y: e.y + 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.03, life: 22, max: 22, r: 2.5 + Math.random() * 2, color: k % 2 === 0 ? color : "#ffffff" });
            }
            playSound('djump');
        }

        function manejarSaltoDoble(code) {
            if (estadoJuego === "MULTI") {
                if (!mp || mp.fin) return;
                let i = code === "KeyW" ? 0 : (code === "ArrowUp" ? 1 : -1);
                if (i >= 0 && mp.jug[i].vivo) intentarDoble(mp.jug[i], mp.jug[i].color);
                return;
            }
            if (code !== "KeyW" && code !== "ArrowUp") return;
            if (estadoJuego === "TUTORIAL") {
                intentarDoble(player, colorSkin());
            } else if (estadoJuego === "JUEGO" && !gameOver && !esperandoSiguienteNivel && !juegoTerminado && boss.animDefeatedTimer === 0) {
                intentarDoble(player, colorSkin());
            }
        }

        // Personaje: orbe-robot con visor, antena, propulsor y squash & stretch
        function oscurecer(hex, f) {
            let n = parseInt(hex.slice(1), 16);
            return `rgb(${Math.round(((n >> 16) & 255) * f)}, ${Math.round(((n >> 8) & 255) * f)}, ${Math.round((n & 255) * f)})`;
        }

        // Personaje: orbe-robot con visor, antena, propulsor, squash & stretch, ropa y accesorios
        function dibujarPersonaje(e, acento, glow, sk) {
            sk = sk || { ojos: 0, cabeza: 0, ropa: 0 };
            let v = visOf(e);
            let r = 12;
            let aire = e.vy !== 0;
            let m = v.face;
            let sway = -v.tilt * 18 - (aire ? Math.max(-6, Math.min(6, e.vy * 0.5)) : 0) + Math.sin(v.t * 0.2) * 1.5;
            let alz = aire ? Math.max(-5, Math.min(7, e.vy * 0.6)) : 0;
            let conAntena = sk.cabeza === 0 || sk.cabeza === 6;

            ctx.save();
            ctx.translate(e.x, e.y + r);
            ctx.rotate(v.tilt);
            ctx.scale(v.sx, v.sy);
            ctx.translate(0, -r);

            // Capa (detrás del cuerpo)
            if (sk.ropa === 1) {
                let gc2 = ctx.createLinearGradient(0, -4, 0, 18);
                gc2.addColorStop(0, oscurecer(acento, 0.75));
                gc2.addColorStop(1, oscurecer(acento, 0.3));
                ctx.fillStyle = gc2;
                ctx.beginPath();
                ctx.moveTo(-8, -3);
                ctx.lineTo(8, -3);
                ctx.quadraticCurveTo(14 + sway * 0.6, 8, 11 + sway, 17 - alz);
                ctx.quadraticCurveTo(sway * 0.6, 20 - alz, -11 + sway, 17 - alz);
                ctx.quadraticCurveTo(-14 + sway * 0.6, 8, -8, -3);
                ctx.closePath();
                ctx.fill();
            }

            // Propulsor
            if (aire) {
                let largo = 5 + Math.min(10, Math.abs(e.vy)) * 0.9 + Math.sin(v.t * 0.8) * 2;
                let gp = ctx.createLinearGradient(0, r - 2, 0, r + largo);
                gp.addColorStop(0, hexA(acento, 0.9));
                gp.addColorStop(1, hexA(acento, 0));
                ctx.fillStyle = gp;
                ctx.beginPath();
                ctx.moveTo(-5, r - 2);
                ctx.lineTo(5, r - 2);
                ctx.lineTo(0, r + largo);
                ctx.closePath();
                ctx.fill();
            }

            // Antena
            if (conAntena) {
                let ax = Math.sin(v.t * 0.12) * 2 - v.tilt * 14;
                ctx.strokeStyle = acento;
                ctx.lineWidth = 2;
                ctx.shadowColor = acento;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(0, -r + 1);
                ctx.quadraticCurveTo(ax * 0.4, -r - 6, ax, -r - 11);
                ctx.stroke();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(ax, -r - 11, 3 + Math.sin(v.t * 0.15) * 1.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Cuerpo
            ctx.shadowColor = glow;
            ctx.shadowBlur = 16;
            let g = ctx.createRadialGradient(-4, -5, 1, 0, 0, r);
            g.addColorStop(0, "#ffffff");
            g.addColorStop(0.6, "#dff7ff");
            g.addColorStop(1, hexA(acento, 1));
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = acento;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = acento;
            ctx.fillRect(-r - 2, -3, 3, 6);
            ctx.fillRect(r - 1, -3, 3, 6);

            // Bufanda y corbatín
            if (sk.ropa === 2) {
                ctx.strokeStyle = "#ff3355";
                ctx.lineCap = "round";
                ctx.lineWidth = 4.2;
                ctx.beginPath();
                ctx.ellipse(0, 5.5, 10.6, 3.6, 0, 0.12, Math.PI - 0.12);
                ctx.stroke();
                ctx.lineWidth = 3.4;
                ctx.beginPath();
                ctx.moveTo(-m * 7, 8.5);
                ctx.quadraticCurveTo(-m * (12 - sway * 0.2), 10, -m * (13 - sway * 0.6), 17 - alz * 0.5);
                ctx.stroke();
                ctx.lineCap = "butt";
            } else if (sk.ropa === 3) {
                ctx.fillStyle = "#ff3355";
                ctx.beginPath();
                ctx.moveTo(0, 8); ctx.lineTo(-6, 4.5); ctx.lineTo(-6, 11.5);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, 8); ctx.lineTo(6, 4.5); ctx.lineTo(6, 11.5);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#ffd0d8";
                ctx.beginPath();
                ctx.arc(0, 8, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }

            // Visor y ojos
            let oy = Math.max(-2, Math.min(2, e.vy * 0.2));
            ctx.fillStyle = "#0a1020";
            ctx.beginPath();
            ctx.ellipse(m * 2.5, -1 + oy * 0.5, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            let parp = (v.t % 200) < 6 ? 0.2 : 1;
            let colOjo = sk.ojos === 3 ? "#ff3355" : acento;
            ctx.fillStyle = colOjo;
            ctx.strokeStyle = colOjo;
            ctx.shadowColor = colOjo;
            ctx.shadowBlur = 8;
            ctx.lineWidth = 1.8;
            ctx.lineCap = "round";
            if (sk.ojos === 1) {
                ctx.beginPath();
                ctx.ellipse(m * 3, -1 + oy, 3.2, 3.2 * parp, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (sk.ojos === 2) {
                [1, 6].forEach(ox => {
                    ctx.beginPath();
                    ctx.arc(m * ox, 0.5 + oy, 2.2, Math.PI * 1.1, Math.PI * 1.9);
                    ctx.stroke();
                });
            } else {
                [1, 6].forEach(ox => {
                    ctx.beginPath();
                    ctx.ellipse(m * ox, -1 + oy, 2, 2 * parp, 0, 0, Math.PI * 2);
                    ctx.fill();
                });
                if (sk.ojos === 3) {
                    ctx.shadowBlur = 0;
                    [1, 6].forEach(ox => {
                        let d = m * Math.sign(3.5 - ox);
                        ctx.beginPath();
                        ctx.moveTo(m * ox - d * 3.2, -5.2 + oy);
                        ctx.lineTo(m * ox + d * 3.2, -2.8 + oy);
                        ctx.stroke();
                    });
                }
            }
            ctx.shadowBlur = 0;
            ctx.lineCap = "butt";

            // Brillo
            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            ctx.beginPath();
            ctx.ellipse(-4, -7, 3, 1.6, -0.5, 0, Math.PI * 2);
            ctx.fill();

            // Accesorios de cabeza
            let cb = sk.cabeza;
            if (cb === 1) { // corona
                let gc = ctx.createLinearGradient(0, -21, 0, -10);
                gc.addColorStop(0, "#fff3a0");
                gc.addColorStop(1, "#d4a017");
                ctx.fillStyle = gc;
                ctx.beginPath();
                ctx.moveTo(-8, -10); ctx.lineTo(-9, -19); ctx.lineTo(-4.5, -14.5); ctx.lineTo(0, -21);
                ctx.lineTo(4.5, -14.5); ctx.lineTo(9, -19); ctx.lineTo(8, -10);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#ff0055";
                ctx.beginPath(); ctx.arc(0, -13.5, 1.5, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#00f0ff";
                ctx.beginPath(); ctx.arc(-4.8, -12.3, 1.1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(4.8, -12.3, 1.1, 0, Math.PI * 2); ctx.fill();
            } else if (cb === 2) { // sombrero de copa
                ctx.fillStyle = "#12121c";
                ctx.fillRect(-6.5, -23, 13, 12);
                ctx.beginPath(); ctx.ellipse(0, -11.5, 11.5, 2.6, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = acento;
                ctx.fillRect(-6.5, -15.5, 13, 2.5);
                ctx.fillStyle = "#1f1f30";
                ctx.beginPath(); ctx.ellipse(0, -23, 6.5, 1.8, 0, 0, Math.PI * 2); ctx.fill();
            } else if (cb === 3) { // halo
                let hy = -19 + Math.sin(v.t * 0.08) * 1.5;
                ctx.strokeStyle = "#ffe066";
                ctx.shadowColor = "#ffe066";
                ctx.shadowBlur = 10;
                ctx.lineWidth = 2.2;
                ctx.beginPath(); ctx.ellipse(0, hy, 8, 2.6, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;
            } else if (cb === 4) { // cuernos
                ctx.fillStyle = "#e0143c";
                [-1, 1].forEach(sd => {
                    ctx.beginPath();
                    ctx.moveTo(sd * 5, -10.5);
                    ctx.quadraticCurveTo(sd * 12, -12, sd * 9, -21);
                    ctx.quadraticCurveTo(sd * 8.5, -14.5, sd * 2.5, -11.5);
                    ctx.closePath();
                    ctx.fill();
                });
            } else if (cb === 5) { // orejas de gato
                [-1, 1].forEach(sd => {
                    ctx.fillStyle = oscurecer(acento, 0.8);
                    ctx.beginPath();
                    ctx.moveTo(sd * 10, -5); ctx.lineTo(sd * 9, -19); ctx.lineTo(sd * 2.5, -11.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = "#ff9ec4";
                    ctx.beginPath();
                    ctx.moveTo(sd * 8.2, -8.5); ctx.lineTo(sd * 7.8, -15.5); ctx.lineTo(sd * 4.2, -11.4);
                    ctx.closePath();
                    ctx.fill();
                });
            } else if (cb === 6) { // gafas de sol
                ctx.fillStyle = "#05060a";
                ctx.strokeStyle = acento;
                ctx.lineWidth = 1.5;
                [1.2, 7].forEach(ox => {
                    ctx.beginPath();
                    ctx.ellipse(m * ox, -1 + oy, 3.4, 3.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                    ctx.beginPath();
                    ctx.moveTo(m * ox - 1.5, -2.6 + oy);
                    ctx.lineTo(m * ox + 0.2, -3.6 + oy);
                    ctx.stroke();
                    ctx.strokeStyle = acento;
                });
            }
            ctx.restore();
        }

        // Fondo con parallax: nebulosas, estrellas lejanas y ruinas cibernéticas
        let ruinas = [];
        for (let capa = 0; capa < 2; capa++) {
            let rx = -80;
            while (rx < 880) {
                let rw = 30 + Math.random() * 60;
                ruinas.push({ x: rx, w: rw, h: (capa ? 70 : 110) + Math.random() * (capa ? 90 : 140), capa: capa });
                rx += rw + 10 + Math.random() * 50;
            }
        }
        let estrellasLejanas = [];
        for (let i = 0; i < 50; i++) {
            estrellasLejanas.push({ x: Math.random() * 800, y: Math.random() * 350, a: Math.random() * 0.6 + 0.2, v: Math.random() * 0.05 + 0.02 });
        }

        function dibujarFondoPro() {
            let col = "#00f0ff";
            if (estadoJuego === "JUEGO" && nivel) col = nivel.color;
            else if (estadoJuego === "TUTORIAL") col = "#00ff88";

            let cam = 400;
            if (estadoJuego === "MENU") cam = 400 + Math.sin(contadorFrames * 0.01) * 80;
            else if (estadoJuego === "MULTI" && mp) {
                let vv = mp.jug.filter(j => j.vivo);
                if (vv.length) cam = vv.reduce((a, j) => a + j.x, 0) / vv.length;
            } else cam = player.x;
            camSuave += (cam - camSuave) * 0.08;
            let off = camSuave - 400;

            ctx.save();
            [[200, 150, 260, 0.10, col], [620, 260, 300, 0.08, "#b000ff"], [420, 60, 220, 0.07, col]].forEach((n, k) => {
                let ox = -off * (0.01 + k * 0.01);
                let pulso = 1 + Math.sin(contadorFrames * 0.01 + k * 2) * 0.08;
                let g = ctx.createRadialGradient(n[0] + ox, n[1], 0, n[0] + ox, n[1], n[2] * pulso);
                g.addColorStop(0, hexA(n[4], n[3]));
                g.addColorStop(1, hexA(n[4], 0));
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, LW, LH);
            });

            estrellasLejanas.forEach(st => {
                let x = (((st.x - off * 0.03) % 800) + 800) % 800;
                ctx.globalAlpha = st.a * (0.6 + 0.4 * Math.sin(contadorFrames * st.v + st.x));
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x, st.y, 1.5, 1.5);
            });
            ctx.globalAlpha = 1;

            ruinas.forEach((r, idx) => {
                let ox = -off * (r.capa ? 0.06 : 0.03);
                let x = r.x + ox;
                let y = LH - r.h;
                ctx.fillStyle = r.capa ? "rgba(8, 14, 32, 0.9)" : "rgba(10, 18, 40, 0.65)";
                ctx.fillRect(x, y, r.w, r.h);
                ctx.fillStyle = hexA(col, r.capa ? 0.35 : 0.2);
                ctx.fillRect(x, y, r.w, 1.5);
                for (let j = 0; j < Math.floor(r.h / 24); j++) {
                    if ((j * 7 + idx * 3) % 5 < 2) {
                        let wx = x + 6 + ((j * 13 + idx * 5) % Math.max(1, Math.floor(r.w - 14)));
                        ctx.fillStyle = hexA(col, 0.22 + 0.14 * Math.sin(contadorFrames * 0.03 + idx + j));
                        ctx.fillRect(wx, y + 10 + j * 24, 4, 4);
                    }
                }
            });

            let hz = ctx.createLinearGradient(0, LH - 170, 0, LH);
            hz.addColorStop(0, hexA(col, 0));
            hz.addColorStop(1, hexA(col, 0.12));
            ctx.fillStyle = hz;
            ctx.fillRect(0, LH - 170, LW, 170);
            ctx.restore();
        }

        // --- VESTIMENTAS: personalización del personaje (se guarda en el navegador) ---
        const SKIN_COLORES = ["#00f0ff", "#00ff88", "#ff0055", "#ffd700", "#b000ff", "#ff7a00", "#ff66cc", "#ffffff"];
        const SKIN_OJOS = ["NORMAL", "CÍCLOPE", "FELIZ", "ENOJADO"];
        const SKIN_CABEZA = ["NADA", "CORONA", "SOMBRERO", "HALO", "CUERNOS", "GATO", "GAFAS"];
        const SKIN_ROPA = ["NADA", "CAPA", "BUFANDA", "CORBATÍN"];
        const SKIN_J2 = { color: 0, ojos: 0, cabeza: 0, ropa: 0 };
        let skin = { color: 0, ojos: 0, cabeza: 0, ropa: 0 };
        let gameOverDesde = 0;
        const skinPrev = { x: 0, y: 0, vy: 0 };

        function colorSkin() { return SKIN_COLORES[skin.color]; }
        function colorJ2() {
            let c = colorSkin();
            return (c === "#ff7a00" || c === "#ffd700") ? "#00f0ff" : "#ffaa00";
        }

        function guardarSkin() {
            try { localStorage.setItem("elysium_skin", JSON.stringify(skin)); } catch (err) {}
        }

        function cargarSkin() {
            try {
                let d = localStorage.getItem("elysium_skin");
                if (!d) return;
                let o = JSON.parse(d);
                if (o && o.color >= 0 && o.color < SKIN_COLORES.length) skin.color = o.color | 0;
                if (o && o.ojos >= 0 && o.ojos < SKIN_OJOS.length) skin.ojos = o.ojos | 0;
                if (o && o.cabeza >= 0 && o.cabeza < SKIN_CABEZA.length) skin.cabeza = o.cabeza | 0;
                if (o && o.ropa >= 0 && o.ropa < SKIN_ROPA.length) skin.ropa = o.ropa | 0;
            } catch (err) {}
        }

        function vestLayout() {
            let L = [];
            SKIN_COLORES.forEach((c, i) => L.push({ cat: "color", val: i, x: 345 + i * 52, y: 108, w: 40, h: 40, color: c }));
            SKIN_OJOS.forEach((t, i) => L.push({ cat: "ojos", val: i, x: 330 + i * 110, y: 190, w: 100, h: 32, txt: t }));
            SKIN_CABEZA.forEach((t, i) => L.push({ cat: "cabeza", val: i, x: 330 + (i % 4) * 110, y: 255 + Math.floor(i / 4) * 40, w: 100, h: 32, txt: t }));
            SKIN_ROPA.forEach((t, i) => L.push({ cat: "ropa", val: i, x: 330 + i * 110, y: 365, w: 100, h: 32, txt: t }));
            return L;
        }

        function clickVestimentas() {
            if (mouseX >= 50 && mouseX <= 220 && mouseY >= 440 && mouseY <= 480) {
                playSound('button');
                estadoJuego = "MENU";
                return;
            }
            if (mouseX >= 590 && mouseX <= 760 && mouseY >= 440 && mouseY <= 480) {
                playSound('button');
                skin.color = Math.floor(Math.random() * SKIN_COLORES.length);
                skin.ojos = Math.floor(Math.random() * SKIN_OJOS.length);
                skin.cabeza = Math.floor(Math.random() * SKIN_CABEZA.length);
                skin.ropa = Math.floor(Math.random() * SKIN_ROPA.length);
                guardarSkin();
                return;
            }
            let lista = vestLayout();
            for (let k = 0; k < lista.length; k++) {
                let o = lista[k];
                if (mouseX >= o.x && mouseX <= o.x + o.w && mouseY >= o.y && mouseY <= o.y + o.h) {
                    skin[o.cat] = o.val;
                    guardarSkin();
                    playSound('button');
                    return;
                }
            }
        }

        // Personaje de muestra que salta y mira hacia el ratón
        function dibujarPreviewSkin(cx, suelo, esc, saltar) {
            let e = skinPrev;
            let v = visOf(e);
            v.t++;
            v.face = mouseX < cx ? -1 : 1;
            v.tilt += (0 - v.tilt) * 0.2;
            let ph = (contadorFrames % 150) / 75;
            let aire = saltar && ph < 1;
            let h = 0;
            e.vy = 0;
            if (aire) {
                h = 22 * 4 * ph * (1 - ph);
                e.vy = -3.5 * (1 - 2 * ph) || 0.01;
            }
            if (v.prevAire && !aire) { v.sx = 1.35; v.sy = 0.7; }
            v.prevAire = aire;
            let tsy = aire ? 1 + Math.min(0.28, Math.abs(e.vy) * 0.07) : 1;
            let tsx = aire ? 1 - (tsy - 1) * 0.7 : 1;
            v.sx += (tsx - v.sx) * 0.2;
            v.sy += (tsy - v.sy) * 0.2;

            ctx.save();
            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
            ctx.beginPath();
            ctx.ellipse(cx, suelo + 1, 13 * esc * (1 - h / 60), 3 * esc * 0.9, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(cx, suelo - 12 * esc - h * esc);
            ctx.scale(esc, esc);
            dibujarPersonaje(e, colorSkin(), colorSkin(), skin);
            ctx.restore();
        }

        function dibujarVestimentas() {
            ctx.save();
            ctx.textAlign = "center";
            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 28px sans-serif";
            ctx.shadowColor = "#ffd700";
            ctx.shadowBlur = 20;
            ctx.fillText("VESTIMENTAS", LW / 2, 48);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "rgba(10, 10, 20, 0.75)";
            ctx.strokeStyle = colorSkin();
            ctx.lineWidth = 1.5;
            ctx.fillRect(50, 80, 250, 340);
            ctx.strokeRect(50, 80, 250, 340);
            ctx.font = "12px sans-serif";
            ctx.fillStyle = "#8892b0";
            ctx.fillText("Tu personaje (mueve el ratón)", 175, 408);

            ctx.textAlign = "left";
            ctx.font = "bold 13px sans-serif";
            ctx.fillStyle = "#ffd700";
            ctx.fillText("COLOR", 330, 98);
            ctx.fillText("OJOS", 330, 180);
            ctx.fillText("CABEZA", 330, 245);
            ctx.fillText("ROPA", 330, 355);
            ctx.restore();

            dibujarPreviewSkin(175, 350, 4, true);

            vestLayout().forEach(o => {
                let activo = skin[o.cat] === o.val;
                let hover = mouseX >= o.x && mouseX <= o.x + o.w && mouseY >= o.y && mouseY <= o.y + o.h;
                ctx.save();
                if (o.color) {
                    let cx = o.x + o.w / 2, cy = o.y + o.h / 2;
                    ctx.fillStyle = o.color;
                    ctx.shadowColor = o.color;
                    ctx.shadowBlur = activo ? 18 : (hover ? 12 : 4);
                    ctx.beginPath();
                    ctx.arc(cx, cy, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    if (activo || hover) {
                        ctx.strokeStyle = "#ffffff";
                        ctx.lineWidth = activo ? 3 : 1.5;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 19.5, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = activo ? hexA(colorSkin(), 0.35) : "rgba(15, 23, 42, 0.9)";
                    ctx.strokeStyle = activo ? colorSkin() : (hover ? "#ffffff" : "#334155");
                    ctx.lineWidth = activo ? 2 : 1.2;
                    ctx.shadowColor = colorSkin();
                    ctx.shadowBlur = activo ? 12 : 0;
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                    ctx.strokeRect(o.x, o.y, o.w, o.h);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = activo ? "#ffffff" : "#b8c2dc";
                    ctx.font = "bold 12px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(o.txt, o.x + o.w / 2, o.y + o.h / 2 + 4);
                }
                ctx.restore();
            });

            dibujarBoton(50, 440, 170, 40, "VOLVER AL MENÚ", "#ff0055");
            dibujarBoton(590, 440, 170, 40, "ALEATORIO", "#b000ff");
        }

        cargarSkin();

        function loop() {
            actualizar();
            dibujar();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
